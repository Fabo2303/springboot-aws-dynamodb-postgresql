<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cargar Datos Meteorológicos</title>
    <link rel="stylesheet" th:href="@{/css/styles4.css}">
</head>
<body>
<div class="container">
    <h1>Datos Meteorológicos</h1>
    <img src="/img/nube-sol.webp" alt="Imagen de una nube y un sol" width="300px"><br>

    <div class="clima">
        <div class="clima-item">
            <span class="label-data">Mes</span>: <span id="month" class="data"></span>
        </div>
        <div class="clima-item">
            <span class="label-data">Año</span>: <span id="year" class="data"></span>
        </div>
        <div class="clima-item">
            <span class="label-data">Temperatura</span>: <span id="temperature" class="data temperature"></span>
        </div>
        <div class="clima-item">
            <span class="label-data">Precipitación</span>: <span id="precipitation" class="data precipitation"></span>
        </div>
    </div>

    <br>
    <br>
    <div class="button-container">
        <a th:href="@{/upload-data}" class="btn">Cargar Datos</a>
    </div>

    <div class="button-container-toggle">
        <button class="btn" onclick="toggleDarkMode()">Alternar Modo Oscuro</button>
    </div>

    <div class="button-back-container">
        <a th:href="@{/}" id="back-btn" class="btn">Regresar</a>
    </div>
</div>

<!-- Scripts de SockJS y STOMP para WebSocket -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.5.1/sockjs.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
<script th:src="@{/js/websocket.js}"></script>

<script>

    function toggleDarkMode() {
        document.body.classList.toggle('dark-theme');
        const currentMode = document.body.classList.contains('dark-theme') ? 'dark' : 'light';
        localStorage.setItem('theme', currentMode);
    }

    document.addEventListener('DOMContentLoaded', function () {
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'dark') {
            document.body.classList.add('dark-theme');
        }
    });

    const files = [];

    function deleteFileByIndex(index) {
        files.splice(index, 1);
        const fileList = document.getElementById('fileList');
        const fileItem = document.getElementById(`file-${index}`);
        const deleteButton = document.getElementById(`delete-${index}`);
        fileItem.removeChild(deleteButton);
        fileList.removeChild(fileItem);
    }

    function addFileToList(file) {
        if (files.length !== 0){
            deleteFileByIndex(0);
        }

        const index = files.length;
        const fileList = document.getElementById('fileList');
        const fileItem = document.createElement('li');
        fileItem.setAttribute('id', `file-${index}`);
        const deleteButton = document.createElement('button');
        deleteButton.innerHTML = 'Delete';
        deleteButton.setAttribute('id', `delete-${index}`);
        deleteButton.addEventListener('click', () => {
            deleteFileByIndex(index);
        });


        fileItem.innerHTML = file.name;
        fileList.appendChild(fileItem);
        fileItem.appendChild(deleteButton);

        files.push(file);
        console.log(files);
    }

    document.getElementById('files').addEventListener('change', (event) => {
        const fileList = event.target.files;
        for (let i = 0; i < fileList.length; i++) {
            addFileToList(fileList[i]);
        }
    });

    function uploadAssignment(event) {
        event.preventDefault();

        const formData = new FormData();

        files.forEach(file => {
            console.log("foreach",file);
            formData.append('csv', file);
        });

        console.log(formData);

        fetch('/cckp-historical-data', {
            method: 'POST',
            body: formData
        })
            .then(response => response.json())
            .then(message => {
                alert(`${message.message}`);
                window.location.href = '/';
            });
    }

    document.getElementById('dataForm').addEventListener('submit', uploadAssignment);
</script>
</body>
</html>
